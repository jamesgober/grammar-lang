# =============================================================================
#  R E P S   ·   grammar-lang
# =============================================================================
[package]
name    = "grammar-lang"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "A runtime parser generator: describe tokens and rules, get a DFA lexer and an LALR(1) parser."

# Keywords (5 max)
keywords = ["grammar", "parser-generator", "lalr", "lexer", "compiler"]

# Categories
categories = ["development-tools", "parser-implementations"]

# Links
homepage      = "https://github.com/jamesgober/grammar-lang"
repository    = "https://github.com/jamesgober/grammar-lang"
documentation = "https://docs.rs/grammar-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "grammar_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["token-lang/std", "diag-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# Tokens: the lexer yields `token_lang::Token<Kind>`, and semantic actions
# receive the same type. `Span` comes from here too.
token-lang = { version = "1", default-features = false }
# Diagnostics: a `ParseError` converts into a `diag_lang::Diagnostic`, ready
# for the family's renderer.
diag-lang  = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# The examples render parse errors and build a typed AST with these.
diag-lang = { version = "1" }
ast-lang  = { version = "1" }


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
